<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="合約雷達">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>幣安合約雷達</title>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js" defer></script>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --line:#2a2f3a; --text:#e8eaf0; --muted:#8b93a7;
  --up:#16c784; --down:#ea3943; --warn:#f0a020; --accent:#4c8dff; --strong:#ff5a5f;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
body.redup{ --up:#ea3943; --down:#16c784; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(8px + var(--st)) 12px 8px;display:flex;align-items:center;gap:8px}
.brand{font-weight:700;font-size:16.5px;white-space:nowrap}
.status{flex:1;color:var(--muted);font-size:12px;line-height:1.3;min-width:0}
.status b{color:var(--text);font-weight:600}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;padding:0;flex:none}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:disabled{opacity:.45}
.ib.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:2px;background:var(--accent);width:0;transition:width .3s;position:fixed;top:0;left:0;z-index:30}
.wrap{max-width:1100px;margin:0 auto;padding:10px 10px calc(84px + var(--sb))}
.banner{display:none;background:#3a1b1e;border:1px solid #6b2a30;color:#ffd5d7;padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:13.5px}
.banner.info{background:#16233a;border-color:#2b4370;color:#cfe0ff}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -10px 10px;padding:0 10px}
.strip::-webkit-scrollbar{display:none}
.mini{flex:none;min-width:138px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 11px}
.mini .k{color:var(--muted);font-size:11.5px}
.mini .v{font-size:16px;font-weight:650;margin-top:1px;white-space:nowrap}
.mini .s{font-size:11.5px;color:var(--muted);white-space:nowrap}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar h2{font-size:17px;margin:0;flex:1}
.bar select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.note{color:var(--muted);font-size:12.5px;margin:0 0 10px;line-height:1.5}
.addw{display:none;gap:6px;margin:0 0 6px}
.wbar{display:none;align-items:center;gap:8px;margin:0 0 10px}
.wbar .mut{font-size:12.5px;flex:1}
.addw input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:8px}
.coin{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.coin:active{background:#1c2029}
.coin.hot{border-color:#6b2a30}
.r1{display:flex;align-items:center;gap:6px}
.star{background:none;border:0;color:#5b6375;font-size:19px;padding:0 2px 0 0;line-height:1}
.star.on{color:#f5c542}
.sym{font-weight:700;font-size:16px}
.badge{font-size:12px;font-weight:700;border-radius:7px;padding:1px 7px;background:var(--line)}
.badge.b5{background:#5a1f25;color:#ffb3b7}.badge.b3{background:#4a3410;color:#ffd38a}.badge.bg{background:#123b2c;color:#9de8c6}
.r1 .px{margin-left:auto;text-align:right}
.px .p{font-weight:600;font-variant-numeric:tabular-nums}
.px .c{font-size:13px;font-weight:600}
.r2{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12.5px;margin-top:6px;font-variant-numeric:tabular-nums}
.r2 b{font-weight:500}
.r3{margin-top:7px;font-size:13px}
.tps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:2px}
.tps div{background:var(--panel2);border-radius:8px;padding:4px 6px;font-variant-numeric:tabular-nums;font-size:12.5px}
.tps span{display:block;color:var(--muted);font-size:10.5px}
.tag{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:6px;margin:2px 4px 2px 0;background:#2a2f3a;color:#c9cede}
.tag.w{background:#4a3410;color:#ffd38a}.tag.r{background:#4d1d22;color:#ffb3b7}.tag.g{background:#123b2c;color:#9de8c6}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--muted)}
.lvl5{color:var(--strong)}.lvl3{color:var(--warn)}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:11.5px;margin-top:16px;line-height:1.6}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(18,20,26,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding:4px 4px calc(4px + var(--sb))}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;position:relative}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--text)}
nav.tabs button.on svg{stroke:var(--accent)}
nav.tabs .n{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--line);color:var(--text);font-size:10.5px;line-height:17px;font-weight:600}
nav.tabs .n.hot{background:var(--strong);color:#fff}
.sheet-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(560px,100%);max-height:90vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;z-index:41;transform:translateY(105%);transition:transform .22s ease;padding:8px 16px calc(20px + var(--sb))}
.sheet.open{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:#3a404c;margin:2px auto 10px}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet h3{font-size:13px;color:var(--muted);font-weight:500;margin:16px 0 6px}
.x{float:right;background:none;border:0;color:var(--muted);font-size:26px;line-height:1;padding:0 2px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv div{background:var(--panel2);border-radius:9px;padding:6px 10px;font-variant-numeric:tabular-nums}
.kv span{display:block;color:var(--muted);font-size:11.5px}
.sig{background:var(--panel2);border-radius:9px;padding:8px 10px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.sig b{white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row label{flex:1}
.row small{display:block;color:var(--muted);font-size:12px;line-height:1.45}
.row input[type=number],.row input[type=text],.row select{width:130px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.row input[type=text]{width:150px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:#3a404c;position:relative;flex:none;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw:checked{background:var(--up)}
.sw:checked::after{left:21px}
.help{background:var(--panel2);border-radius:10px;padding:10px 12px;font-size:13px;color:#c9cede;line-height:1.6;margin-top:12px}
.toasts{position:fixed;left:10px;right:10px;top:calc(60px + var(--st));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;width:min(420px,100%);background:#2a1c10;border:1px solid #7a5418;border-radius:12px;padding:9px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:13.5px}
.toast.r{background:#2c1416;border-color:#7a2a30}.toast.g{background:#0f2a20;border-color:#1f6b4e}
.toast b{display:block;margin-bottom:2px}
[data-term]{cursor:pointer}
.kv span[data-term]::after,.tps span[data-term]::after,.sig[data-term] > span::after,.gl-label[data-term]::after{content:" ⓘ";opacity:.55}
.tag[data-term]{text-decoration:underline dotted rgba(255,255,255,.35);text-underline-offset:3px}
.gloss-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70}
.gloss-bg.open{display:block}
.gloss{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--sb));margin:0 auto;max-width:440px;background:#20252f;border:1px solid #3a4150;border-radius:14px;padding:14px 16px;z-index:71;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
.gloss.open{display:block}
.gloss h4{margin:0 0 6px;font-size:16px}
.gloss p{margin:0;font-size:14px;line-height:1.65;color:#d5d9e3}
.gloss .how{margin-top:8px;font-size:13px;color:var(--muted)}
.glist div{padding:9px 0;border-bottom:1px solid var(--line)}
.glist b{display:block;margin-bottom:2px}
.glist span{font-size:13.5px;color:#c9cede;line-height:1.6}
.tag.b{background:#16294a;color:#a9c8ff}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -10px 10px;padding:0 10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:transparent;border:1px solid var(--line);border-radius:16px;padding:4px 11px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--panel2);color:var(--text);border-color:#4a5262}
.news{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.news + .news{margin-top:8px}
.nh{display:flex;gap:8px;font-size:12px;color:var(--muted)}
.nh .ns{margin-left:auto;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntl{font-size:14.5px;line-height:1.55;margin-top:3px;word-break:break-word}
.news.fresh{border-color:#2b4370}
.nbody{display:none;margin-top:8px;font-size:13.5px;line-height:1.65;color:#d5d9e3;white-space:pre-wrap;word-break:break-word}
.news.open .nbody{display:block}
.ai{background:var(--panel2);border-radius:9px;padding:8px 10px;margin-top:8px;white-space:normal}
.ai b{display:block;font-size:12.5px;color:#a9c8ff;margin-bottom:3px}
.ai ul{margin:0;padding-left:18px}.ai p{margin:4px 0}
.ai-note{font-size:11.5px;color:var(--muted);margin-top:4px}
.nlink{display:inline-block;margin-top:8px;color:#8fb4ff}
.dn .news{background:var(--panel2);border-color:transparent}
.log div{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
@media (min-width:900px){ .wrap{padding-left:16px;padding-right:16px} .strip{margin:0 0 12px;padding:0} }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header class="top">
  <div class="brand">合約雷達</div>
  <div class="status" id="status">準備中…</div>
  <button class="ib" id="scanBtn" aria-label="立即掃描"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  <button class="ib" id="logBtn" aria-label="通知紀錄"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
  <button class="ib" id="setBtn" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<div class="wrap">
  <div class="banner" id="banner"></div>
  <div class="banner info" id="installTip"></div>
  <div class="strip" id="strip"></div>
  <div class="bar"><h2 id="tabTitle"></h2><select id="sortSel" aria-label="排序"></select></div>
  <div class="note" id="note"></div>
  <div class="addw" id="addWatch"><input id="addSym" placeholder="輸入幣種，例如 SOL" autocapitalize="characters"><button class="btn" id="addBtn">加入自選</button></div>
  <div class="wbar" id="wbar"><button class="btn primary" id="wscanBtn">只掃自選</button><span class="mut" id="wInfo"></span></div>
  <div class="chips" id="nchips" style="display:none"></div>
  <div class="list" id="list"></div>
  <footer>資料來自幣安 USDT 永續合約公開行情，不用 API key，也不會下單。訊號都是用過去的價格和量能算出來的，不保證會漲或跌，也不是投資建議。App 開在前景時才會掃描；切到背景或鎖屏會暫停，回來時自動補掃。</footer>
</div>

<nav class="tabs" id="tabs"></nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toasts" id="toasts"></div>
<div class="gloss-bg" id="glossBg"></div>
<div class="gloss" id="gloss"></div>

<script>
'use strict';
const API = 'https://fapi.binance.com';
const DEFAULTS = { mainVol: 20, watchVol: 5, interval: 5, alertMin: 5, notifyDrop: true, notifyBreakout: true, notifySetup: true, setupMin: 6, notifyDump: true, dumpPct: 5, notifyNews: true, notifyNewsAll: false, ver: 5,  redUp: false, wake: false, tradfi: true, tgToken: '', tgChat: '', watchlist: [] };
function loadSettings() { try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('bnRadarSettings') || '{}')); } catch (e) { return Object.assign({}, DEFAULTS); } }
function saveSettings() { try { localStorage.setItem('bnRadarSettings', JSON.stringify(S)); } catch (e) {} }
let S = loadSettings();
if ((S.ver || 1) < 2) { S.notifyBreakout = true; S.notifySetup = true; } // 舊版設定：突破和埋伏通知預設改成開啟
if ((S.ver || 1) < 3) { delete S.sound; delete S.vibrate; } // 已移除提示音和震動
if ((S.ver || 1) < 4) { S.notifyDump = true; S.dumpPct = 5; } // 新增急跌通知
if ((S.ver || 1) < 5) { S.notifyNews = true; S.notifyNewsAll = false; S.ver = 5; saveSettings(); } // 新增快訊

const state = { info: new Map(), infoAt: 0, results: [], universe: [], byTab: {}, lastScan: 0, nextScan: 0, scanning: false,
  firstDone: false, alerted: new Map(), log: [], tab: 'warn', sort: 'score', timer: null, sheet: null, swReg: null, wakeLock: null };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((s, v) => s + v, 0);

async function getJSON(path) {
  const r = await fetch(API + path, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + path.split('?')[0]);
  return r.json();
}
async function pool(items, n, fn) {
  const out = new Array(items.length); let i = 0;
  async function worker() { while (i < items.length) { const k = i++; try { out[k] = await fn(items[k], k); } catch (e) { out[k] = null; } } }
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
  return out;
}
function ema(a, p) {
  const k = 2 / (p + 1), out = new Array(a.length).fill(NaN); let s = 0;
  for (let i = 0; i < a.length; i++) { if (i < p) { s += a[i]; if (i === p - 1) out[i] = s / p; } else out[i] = a[i] * k + out[i - 1] * (1 - k); }
  return out;
}
function rsi(a, p = 14) {
  const out = new Array(a.length).fill(NaN); if (a.length <= p) return out;
  let g = 0, l = 0;
  for (let i = 1; i <= p; i++) { const d = a[i] - a[i - 1]; if (d > 0) g += d; else l -= d; }
  g /= p; l /= p; out[p] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
  for (let i = p + 1; i < a.length; i++) { const d = a[i] - a[i - 1]; g = (g * (p - 1) + Math.max(d, 0)) / p; l = (l * (p - 1) + Math.max(-d, 0)) / p; out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l); }
  return out;
}
function atr(b, p = 14) {
  const tr = b.map((x, i) => i ? Math.max(x.h - x.l, Math.abs(x.h - b[i - 1].c), Math.abs(x.l - b[i - 1].c)) : x.h - x.l);
  let a = sum(tr.slice(1, p + 1)) / p;
  for (let i = p + 1; i < tr.length; i++) a = (a * (p - 1) + tr[i]) / p;
  return a;
}
function tickDec(t) { const s = String(t); if (!s.includes('.')) return 0; return (s.replace(/0+$/, '').split('.')[1] || '').length; }
function fp(v, r) {
  if (v == null || !isFinite(v)) return '—';
  const info = r && state.info.get(r.sym);
  if (info) return (Math.round(v / info.tick) * info.tick).toFixed(info.dec);
  return v >= 100 ? v.toFixed(2) : v >= 1 ? v.toFixed(4) : v.toPrecision(4);
}
function pct(v, d = 1) {
  if (v == null || !isFinite(v)) return '<span class="mut">—</span>';
  return `<span class="${v > 0 ? 'up' : v < 0 ? 'down' : 'mut'}">${v > 0 ? '+' : ''}${v.toFixed(d)}%</span>`;
}
function vol(v) { return v >= 1e9 ? (v / 1e9).toFixed(2) + 'B' : (v / 1e6).toFixed(1) + 'M'; }
function fr(v) { if (v == null) return '—'; const s = (v * 100).toFixed(3) + '%'; return v >= 0.0005 ? `<span class="down">${s}</span>` : v <= -0.0005 ? `<span class="up">${s}</span>` : s; }
function timeStr(t) { return new Date(t).toLocaleTimeString('zh-TW', { hour12: false }); }

/* ---------- 資料 ---------- */
async function loadExchangeInfo() {
  const j = await getJSON('/fapi/v1/exchangeInfo');
  const m = new Map();
  for (const s of j.symbols) {
    // 幣安的股票、商品合約可能用 TRADIFI_PERPETUAL 這類合約型態，所以只要是永續都收
    if (!/PERPETUAL/.test(s.contractType || '') || s.quoteAsset !== 'USDT' || s.status !== 'TRADING') continue;
    const ut = s.underlyingType || 'COIN';
    const kind = ut === 'COIN' && s.contractType === 'PERPETUAL' ? '' : ({ EQUITY: '股票', STOCK: '股票', COMMODITY: '商品', INDEX: '指數' }[ut] || '傳統金融');
    const pf = (s.filters || []).find((f) => f.filterType === 'PRICE_FILTER');
    m.set(s.symbol, { base: s.baseAsset, kind, tick: pf ? +pf.tickSize : 0.0001, dec: tickDec(pf ? pf.tickSize : '0.0001') });
  }
  state.info = m; state.infoAt = Date.now();
}

/* ---------- 分析 ---------- */
function analyze(t, k, fund) {
  if (!k || k.length < 30) return null; // 新上架的合約 K 線較少，EMA55 相關訊號會自動略過
  const bars = k.map((b) => ({ t: +b[0], o: +b[1], h: +b[2], l: +b[3], c: +b[4], qv: +b[7] }));
  const cur = bars[bars.length - 1];
  const done = bars.slice(0, -1); // 已收完的 1H K
  const n = done.length;
  const p = +t.lastPrice;
  const closes = done.map((b) => b.c);
  const e9 = ema(closes, 9), e21 = ema(closes, 21), e55 = ema(closes, 55);
  const R = rsi(closes, 14);
  const A = atr(done, 14);
  const last = done[n - 1], prev = done[n - 2];
  const elapsed = Date.now() - cur.t;
  const chg = (N) => { const i = bars.length - 1 - N; if (i < 0) return null; const base = elapsed >= 30 * 60e3 ? bars[i].c : bars[i].o; return (p / base - 1) * 100; };
  const r = {
    sym: t.symbol, base: (state.info.get(t.symbol) || {}).base || t.symbol.replace(/USDT$/, ''), kind: (state.info.get(t.symbol) || {}).kind || '',
    p, qv: +t.quoteVolume, c24: +t.priceChangePercent, c12: chg(12), c4: chg(4), c1: chg(1),
    high24: +t.highPrice, low24: +t.lowPrice, fund: fund ?? null,
    // E21/E55 給訊號用（只算已收完的 K 線）；E21L/E55L 給畫面顯示用（含目前這根，跟幣安圖表一樣）
    E9: e9[n - 1], E21: e21[n - 1], E55: e55[n - 1],
    E21L: ema(closes.concat([p]), 21).at(-1), E55L: ema(closes.concat([p]), 55).at(-1),
    rsi: R[n - 1], atr: A, atrPct: A / p * 100,
    warns: [], flags: [], oi4: null
  };
  const avgWin = done.slice(Math.max(0, n - 24), n - 4);
  const avgH = sum(avgWin.map((b) => b.qv)) / (avgWin.length || 1) || 1;
  r.volRatio4 = sum(done.slice(n - 4).map((b) => b.qv)) / (avgH * 4);
  r.lastVolRatio = last.qv / avgH;
  const high12 = Math.max(...bars.slice(-12).map((b) => b.h));
  r.swingLow = Math.min(...done.slice(-6).map((b) => b.l));
  r.ext = (p - r.E21) / A;

  for (let j = n - 1; j >= n - 3 && j >= 20; j--) {
    const lvl = Math.max(...done.slice(j - 20, j).map((b) => b.h));
    if (done[j].c > lvl && done[j].qv >= 1.8 * avgH) { r.brk = { level: lvl, barsAgo: n - 1 - j, volX: done[j].qv / avgH, holding: p >= lvl }; break; }
  }

  const bullTrend = r.E9 > r.E21 && r.E21 > r.E55 && last.c > r.E21;
  r.isBull = r.qv >= S.mainVol * 1e6 && r.c24 > 0 && r.c12 > 0 && r.c4 > 0 && r.c1 > 0 && bullTrend;
  if (r.isBull) {
    let sc = clamp(r.c24, 0, 40) * 0.25 + clamp(r.c12, 0, 30) * 0.35 + clamp(r.c4, 0, 20) * 0.5 + clamp(r.c1, 0, 10) * 0.6 + Math.min(r.volRatio4, 3) * 2 + Math.log10(r.qv / 1e6);
    if (r.fund >= 0.001) { sc -= 4; r.flags.push(['r', '費率過熱']); } else if (r.fund >= 0.0005) { sc -= 2; r.flags.push(['w', '費率偏高']); }
    if (r.ext > 4) { sc -= 3; r.flags.push(['r', '離均線太遠']); } else if (r.ext > 3) { sc -= 1.5; r.flags.push(['w', '有點延伸']); }
    if (p >= r.high24 * 0.99) r.flags.push(['w', '貼近 24h 高']);
    if (r.volRatio4 >= 1.5) r.flags.push(['g', '量能放大']);
    if (r.rsi >= 75) r.flags.push(['w', 'RSI 超買']);
    r.bullScore = sc;
    r.tp1 = p + A; r.tp2 = Math.max(p + 2 * A, r.high24 > p * 1.005 ? r.high24 : 0); r.tp3 = Math.max(r.tp2 + 1.5 * A, p + 3.5 * A);
    const d = Math.max(r.E21L, r.swingLow); r.defense = d < p ? d : r.swingLow;
  }

  r.isBear = r.qv >= S.mainVol * 1e6 && r.c24 < 0 && r.c12 < 0 && r.c4 < 0 && r.c1 < 0 && r.E9 < r.E21 && r.E21 < r.E55 && last.c < r.E21;
  if (r.isBear) r.bearScore = clamp(-r.c24, 0, 40) * 0.25 + clamp(-r.c12, 0, 30) * 0.35 + clamp(-r.c4, 0, 20) * 0.5 + clamp(-r.c1, 0, 10) * 0.6 + Math.min(r.volRatio4, 3) * 2;

  const W = (pts, text, key) => r.warns.push({ pts, text, key });
  // 只算「原本在上方、這根才明確跌破」的情況，避免盤整時均線糾結一直誤報
  const aboveE55 = done.slice(n - 7, n - 1).filter((b, i) => b.c > e55[n - 7 + i]).length;
  if (last.c < r.E55 - 0.2 * A && prev.c >= e55[n - 2] && aboveE55 >= 4) W(3, '1H 收盤跌破 EMA55，短線多頭結構破壞', 'e55');
  if (last.c < r.E21 - 0.1 * A && prev.c >= e21[n - 2]) W(r.E21 > r.E55 ? 2 : 1, '1H 收盤跌破 EMA21', 'e21');
  else if (last.c < r.E21 && r.E9 < r.E21 && r.E21 > r.E55) W(1, '價格壓在 EMA21 下方，EMA9 已下彎', 'e21b');
  const cross = (i) => e9[i] < e21[i] && e9[i - 1] >= e21[i - 1];
  if (cross(n - 1) || cross(n - 2)) W(2, 'EMA9 下穿 EMA21（死叉）', 'cross');
  const offTop = (1 - p / r.high24) * 100;
  if (r.c24 > 5 && offTop >= Math.max(4, 1.5 * r.atrPct)) W(2, `大漲後從 24h 高點回落 ${offTop.toFixed(1)}%`, 'top');
  {
    const body = Math.abs(last.c - last.o), upper = last.h - Math.max(last.o, last.c), range = last.h - last.l;
    if (range > 0 && upper >= 2 * body && upper >= 0.5 * range && r.lastVolRatio >= 1.5 && last.h >= r.high24 * 0.985) W(2, '高位長上影線＋放量，上方賣壓重', 'wick');
  }
  const rsiMax = Math.max(...R.slice(n - 6, n).filter(isFinite));
  if (rsiMax >= 75 && r.rsi < 65) W(2, `RSI 從超買區（${rsiMax.toFixed(0)}）回落到 ${r.rsi.toFixed(0)}`, 'rsi');
  if (p >= high12 * 0.99 && r.volRatio4 < 0.7) W(1, '價格在高點但量能萎縮（量價背離）', 'div');
  if (r.fund >= 0.001 && r.c1 < 0) W(2, '資金費率過熱且開始回落，多單擁擠', 'fund');
  else if (r.fund >= 0.0005 && r.c1 < 0) W(1, '資金費率偏高且開始回落', 'fund');
  if (last.c < last.o && last.o - last.c >= 1.2 * A && r.lastVolRatio >= 2) W(2, `放量長黑 K（量 ${r.lastVolRatio.toFixed(1)} 倍）`, 'red');
  if (r.brk && !r.brk.holding && p < r.brk.level * 0.995) W(2, '放量突破後又跌回突破位（假突破）', 'fake');
  // 急跌：不等 K 線收盤，直接看現價離最近 1～2 小時高點跌了多少
  r.dumpHi = Math.max(cur.h, last.h);
  r.dump = Math.max(0, (1 - p / r.dumpHi) * 100);
  if (r.dump >= S.dumpPct) W(3, `近 1～2 小時從 ${fp(r.dumpHi, r)} 急跌 ${r.dump.toFixed(1)}%`, 'dump');
  r.warnScore = sum(r.warns.map((w) => w.pts));
  r.supports = [r.E21L, r.E55L, r.swingLow, r.low24].filter((v) => isFinite(v) && v < p * 0.998).sort((a, b) => b - a).slice(0, 2);

  /* ---- 值得埋伏：波動收斂、貼近壓力、趨勢沒壞、還沒噴 ---- */
  if (n >= 80) {
    const bbw = [];
    for (let i = 19; i < n; i++) {
      const w = closes.slice(i - 19, i + 1), m = sum(w) / 20;
      bbw.push(Math.sqrt(sum(w.map((x) => (x - m) ** 2)) / 20) * 4 / m);
    }
    const recent = bbw.slice(-60), wNow = bbw[bbw.length - 1];
    const rank = recent.filter((x) => x < wNow).length / recent.length; // 0 = 最窄
    const res = Math.max(...done.slice(n - 20).map((b) => b.h));
    const rangeLow = Math.min(...done.slice(n - 12).map((b) => b.l));
    const gap = (res / p - 1) * 100;
    const squeeze = rank <= 0.2;
    const nearRes = p <= res && gap <= Math.max(1.5, 0.8 * r.atrPct);
    const trendOk = last.c > r.E55 && r.E21 >= r.E55 * 0.998;
    const calm = Math.abs(r.c24) <= 8 && Math.abs(r.c4) <= 3;
    if (squeeze && nearRes && trendOk && calm && r.warnScore < 3 && (r.fund ?? 0) < 0.0005) {
      const tags = [['g', '波動收斂']];
      let sc = 4 + (rank <= 0.1 ? 1 : 0);
      if (rank <= 0.1) tags[0] = ['g', '波動極度收斂'];
      if (Math.min(...done.slice(n - 6).map((b) => b.l)) > Math.min(...done.slice(n - 12, n - 6).map((b) => b.l))) { sc += 1; tags.push(['g', '低點墊高']); }
      if (r.volRatio4 < 0.8) { sc += 1; tags.push(['', '量縮整理']); }
      if (r.fund != null && r.fund < 0) { sc += 1; tags.push(['g', '負費率（空方付費）']); }
      if (r.E9 > r.E21 && r.E21 > r.E55) { sc += 1; tags.push(['g', '均線多頭排列']); }
      r.setup = { res, gap, defense: Math.max(rangeLow, r.E55L) < p ? Math.max(rangeLow, r.E55L) : rangeLow, score: sc, tags, rank };
    }
  }
  return r;
}

function applyOI(r, list) {
  if (!list || list.length < 2) return;
  const a = +list[0].sumOpenInterest, b = +list[list.length - 1].sumOpenInterest;
  if (!a) return;
  r.oi4 = (b / a - 1) * 100;
  if (r.c4 < 0 && r.oi4 >= 3) r.warns.push({ pts: 1, text: `價跌但持倉量增加 ${r.oi4.toFixed(1)}%（空單加碼）`, key: 'oi' });
  if (r.c4 > 0 && r.oi4 <= -3) { r.warns.push({ pts: 1, text: `價漲但持倉量減少 ${(-r.oi4).toFixed(1)}%（多為空單回補，續航較弱）`, key: 'oi' }); r.flags.push(['w', 'OI 下降']); }
  if (r.isBull && r.oi4 >= 3) r.flags.push(['g', 'OI 增加']);
  if (r.setup && r.oi4 >= 3 && Math.abs(r.c4) < 2) { r.setup.score += 2; r.setup.tags.push(['g', `價平 OI 增 ${r.oi4.toFixed(1)}%（有人建倉）`]); }
  r.warnScore = sum(r.warns.map((w) => w.pts));
}

/* ---------- 掃描 ---------- */
function setProgress(f) { $('progress').style.width = f ? (f * 100).toFixed(0) + '%' : '0'; }
async function scan() {
  if (state.scanning) return;
  state.scanning = true; $('scanBtn').disabled = true; $('scanBtn').classList.add('spin'); clearTimeout(state.timer);
  setStatus('掃描中…'); setProgress(0.03);
  try {
    if (!state.info.size || Date.now() - state.infoAt > 6 * 3600e3) await loadExchangeInfo();
    const [tick, prem] = await Promise.all([getJSON('/fapi/v1/ticker/24hr'), getJSON('/fapi/v1/premiumIndex')]);
    const fund = new Map(prem.map((x) => [x.symbol, +x.lastFundingRate]));
    const universe = tick.filter((t) => state.info.has(t.symbol) && ((+t.quoteVolume >= S.watchVol * 1e6 && (S.tradfi || !state.info.get(t.symbol).kind)) || S.watchlist.includes(t.symbol)));
    let done = 0;
    const rows = await pool(universe, 8, async (t) => {
      const k = await getJSON(`/fapi/v1/klines?symbol=${t.symbol}&interval=1h&limit=300`);
      done++; setProgress(0.05 + 0.8 * done / universe.length);
      if (done % 10 === 0) setStatus(`掃描中… ${done}/${universe.length}`);
      return analyze(t, k, fund.get(t.symbol));
    });
    const res = rows.filter(Boolean);
    const shortlist = [...new Set([
      ...res.filter((r) => r.isBull).sort((a, b) => b.bullScore - a.bullScore).slice(0, 15),
      ...res.filter((r) => r.warnScore >= 2).sort((a, b) => b.warnScore - a.warnScore).slice(0, 30),
      ...res.filter((r) => r.setup).sort((a, b) => b.setup.score - a.setup.score).slice(0, 20),
      ...res.filter((r) => S.watchlist.includes(r.sym))
    ])].slice(0, 50);
    setStatus('讀取持倉量…'); setProgress(0.9);
    await pool(shortlist, 4, async (r) => applyOI(r, await getJSON(`/futures/data/openInterestHist?symbol=${r.sym}&period=1h&limit=5`)));
    const uni = tick.filter((t) => state.info.has(t.symbol));
    state.results = res; state.lastScan = Date.now();
    state.mkt = { up: uni.filter((t) => +t.priceChangePercent > 0).length, total: uni.length };
    hideBanner(); classify(); handleAlerts(); render(); saveCache();
  } catch (e) {
    showBanner(`連不到幣安合約 API：${esc(e.message || e)}。請確認網路，或你目前的網路/地區是否被幣安限制。會在下次排程自動重試。`);
  } finally {
    state.scanning = false; $('scanBtn').disabled = false; $('scanBtn').classList.remove('spin'); setProgress(0);
    state.nextScan = Date.now() + S.interval * 60e3;
    state.timer = setTimeout(scan, S.interval * 60e3);
    tickStatus();
  }
}
function classify() {
  const R = state.results;
  state.byTab = {
    warn: R.filter((r) => r.warnScore >= 3),
    setup: R.filter((r) => r.setup),
    bull: R.filter((r) => r.isBull),
    brk: R.filter((r) => r.brk),
    bear: R.filter((r) => r.isBear),
    watch: R.filter((r) => S.watchlist.includes(r.sym))
  };
}

/* ---------- 通知 ---------- */
function handleAlerts() {
  const now = Date.now(), items = [];
  for (const r of state.results) {
    const need = S.watchlist.includes(r.sym) ? Math.min(3, S.alertMin) : S.alertMin;
    const key = 'w:' + r.sym, pa = state.alerted.get(key);
    if (r.warnScore < 3 && pa) state.alerted.delete(key);
    if (S.notifyDrop && r.warnScore >= need && (!pa || r.warnScore >= pa.score + 2 || now - pa.t > 2 * 3600e3)) {
      items.push({ type: 'drop', r }); state.alerted.set(key, { score: r.warnScore, t: now });
    }
    if (S.notifyBreakout && r.brk && r.brk.barsAgo === 0 && r.brk.holding) {
      const bk = 'b:' + r.sym + ':' + r.brk.level;
      if (!state.alerted.has(bk)) { items.push({ type: 'brk', r }); state.alerted.set(bk, { t: now }); }
    }
    const dk = 'd:' + r.sym, pd = state.alerted.get(dk);
    const dthr = S.watchlist.includes(r.sym) ? S.dumpPct * 0.6 : S.dumpPct; // 自選幣門檻比較低
    if (pd && r.dump < dthr * 0.5) state.alerted.delete(dk);
    if (S.notifyDump && r.dump >= dthr && (!pd || r.dump >= pd.score + dthr / 2 || now - pd.t > 3600e3)) {
      items.push({ type: 'dump', r }); state.alerted.set(dk, { score: r.dump, t: now });
    }
    const sk = 's:' + r.sym, ps = state.alerted.get(sk);
    if (!r.setup && ps) state.alerted.delete(sk);
    if (S.notifySetup && r.setup && r.setup.score >= S.setupMin && (!ps || now - ps.t > 6 * 3600e3)) {
      items.push({ type: 'setup', r }); state.alerted.set(sk, { t: now });
    }
  }
  const dumps = items.filter((i) => i.type === 'dump').sort((a, b) => b.r.dump - a.r.dump);
  if (dumps.length > 3) notify('r', `急跌 ${dumps.length} 檔`, dumps.slice(0, 8).map((i) => `${i.r.base} -${i.r.dump.toFixed(1)}%｜${fp(i.r.dumpHi, i.r)} → ${fp(i.r.p, i.r)}`).join('\n'));
  else dumps.forEach((i) => notify('r', `${i.r.base} 急跌 -${i.r.dump.toFixed(1)}%`, `近 1～2 小時 ${fp(i.r.dumpHi, i.r)} → ${fp(i.r.p, i.r)}\n${fmtShort(i.r)}`));
  const drops = items.filter((i) => i.type === 'drop').sort((a, b) => b.r.warnScore - a.r.warnScore), brks = items.filter((i) => i.type === 'brk');
  if (drops.length) {
    if (!state.firstDone || drops.length > 3) notify('r', `轉弱警示 ${drops.length} 檔`, drops.slice(0, 8).map((i) => `${i.r.base} ${i.r.warnScore}分 ${fmtShort(i.r)}`).join('\n') + (drops.length > 8 ? `\n…等 ${drops.length} 檔` : ''));
    else drops.forEach((i) => notify('r', `${i.r.base} 轉弱 ${i.r.warnScore} 分`, `${fmtShort(i.r)}\n${i.r.warns.map((w) => '・' + w.text).join('\n')}`));
  }
  const sets = items.filter((i) => i.type === 'setup').sort((a, b) => b.r.setup.score - a.r.setup.score);
  if (sets.length) notify('', `值得埋伏 ${sets.length} 檔`, sets.slice(0, 8).map((i) => `${i.r.base} ${i.r.setup.score}分 ${fp(i.r.p, i.r)}｜突破位 ${fp(i.r.setup.res, i.r)}（差 ${i.r.setup.gap.toFixed(1)}%）`).join('\n'));
  if (brks.length) notify('g', `放量突破 ${brks.length} 檔`, brks.slice(0, 8).map((i) => `${i.r.base} 突破 ${fp(i.r.brk.level, i.r)}（量 ${i.r.brk.volX.toFixed(1)} 倍）`).join('\n'));
  state.firstDone = true;
}
function fmtShort(r) { return `${fp(r.p, r)}｜24h ${r.c24 > 0 ? '+' : ''}${r.c24.toFixed(1)}%｜1h ${(r.c1 ?? 0) > 0 ? '+' : ''}${(r.c1 ?? 0).toFixed(1)}%`; }

function toast(kind, title, body, ms = 10000) {
  const el = document.createElement('div'); el.className = 'toast ' + kind;
  el.innerHTML = `<b>${esc(title)}</b>${esc(body).replace(/\n/g, '<br>')}`;
  el.onclick = () => el.remove();
  $('toasts').prepend(el); setTimeout(() => el.remove(), ms);
  while ($('toasts').children.length > 3) $('toasts').lastChild.remove();
}
function notify(kind, title, body) {
  state.log.unshift({ t: Date.now(), title, body }); state.log = state.log.slice(0, 200);
  toast(kind, title, body);
  sysNotify(title, body);
  tgSend(`${title}\n${body}`);
}
function sysNotify(title, body) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const opt = { body, tag: title, icon: 'icon-192.png', badge: 'icon-192.png' };
    if (state.swReg && state.swReg.showNotification) state.swReg.showNotification(title, opt).catch(() => {});
    else new Notification(title, opt);
  } catch (e) {}
}
function tgSend(text) {
  if (!S.tgToken || !S.tgChat) return;
  fetch(`https://api.telegram.org/bot${S.tgToken.replace(/[^\w:-]/g, '')}/sendMessage`, { method: 'POST', mode: 'no-cors', body: new URLSearchParams({ chat_id: S.tgChat, text }) }).catch(() => {});
}

}

const SORTS = { score: '依分數', c24: '依 24h 漲幅', c1: '依 1h 漲幅', qv: '依成交額' };
function scoreOf(r, tab) {
  if (tab === 'bull') return r.bullScore;
  if (tab === 'setup') return r.setup.score * 100 - r.setup.gap;
  if (tab === 'bear') return r.bearScore;
  if (tab === 'brk') return -r.brk.barsAgo * 100 + r.brk.volX;
  return r.warnScore * 1e3 + Math.log10(r.qv);
}
function sorted(tab) {
  const rows = (state.byTab[tab] || []).slice(), k = state.sort;
  const f = k === 'score' ? (r) => scoreOf(r, tab) : (r) => r[k] ?? -1e18;
  return rows.sort((a, b) => f(b) - f(a));
}
function setTab(t) {
  state.tab = t; window.scrollTo(0, 0); render();

/* ---------- 只掃自選：幾個幣幾秒就好，不影響全市場掃描的時間表 ---------- */
async function scanWatch() {
  if (state.scanning || state.wscanning || !S.watchlist.length) return;
  state.wscanning = true; $('wscanBtn').disabled = true; $('wscanBtn').textContent = '掃描中…';
  try {
    if (!state.info.size) await loadExchangeInfo();
    const syms = S.watchlist.filter((x) => state.info.has(x));
    const rows = await pool(syms, 6, async (sym) => {
      const [t, pr, k] = await Promise.all([
        getJSON(`/fapi/v1/ticker/24hr?symbol=${sym}`), getJSON(`/fapi/v1/premiumIndex?symbol=${sym}`),
        getJSON(`/fapi/v1/klines?symbol=${sym}&interval=1h&limit=300`)]);
      const r = analyze(t, k, +pr.lastFundingRate);
      if (r) { try { applyOI(r, await getJSON(`/futures/data/openInterestHist?symbol=${sym}&period=1h&limit=5`)); } catch (e) {} }
      return r;
    });
    const fresh = rows.filter(Boolean), m = new Map(fresh.map((r) => [r.sym, r]));
    if (!fresh.length) throw new Error('沒有拿到資料');
    state.results = state.results.filter((r) => !m.has(r.sym)).concat(fresh);
    state.watchAt = Date.now();
    classify(); handleAlerts(); render(); saveCache();
  } catch (e) {
    toast('r', '自選掃描失敗', String(e.message || e), 5000);
  } finally {
    state.wscanning = false; $('wscanBtn').disabled = false; $('wscanBtn').textContent = '只掃自選'; renderWInfo();
  }
}
function renderWInfo() { $('wInfo').textContent = state.watchAt ? `自選更新 ${timeStr(state.watchAt)}` : `${S.watchlist.length} 個自選幣`; }

function card(r, tab) {
  const w = S.watchlist.includes(r.sym);
  let badge = '';
  if (tab === 'bull') badge = `<span class="badge bg">${r.bullScore.toFixed(1)}</span>`;
  else if (tab === 'bear') badge = `<span class="badge b5">${r.bearScore.toFixed(1)}</span>`;
  else if (tab === 'setup') badge = `<span class="badge ${r.setup.score >= 6 ? 'bg' : ''}">${r.setup.score} 分</span>`;
  else if (tab === 'brk') badge = `<span class="badge ${r.brk.holding ? 'bg' : 'b5'}">${r.brk.volX.toFixed(1)}×</span>`;
  else if (r.warnScore >= 1) badge = `<span class="badge ${r.warnScore >= 5 ? 'b5' : r.warnScore >= 3 ? 'b3' : ''}">${r.warnScore} 分</span>`;
  let r3 = '';
  const warnTags = () => r.warns.length ? r.warns.map((x) => `<span class="tag ${x.pts >= 2 ? 'r' : 'w'}">${shortSig(x.key)}</span>`).join('') : '<span class="mut">沒有轉弱訊號</span>';
  if (tab === 'bull') r3 = `<div class="tps"><div><span>TP1</span>${fp(r.tp1, r)}</div><div><span>TP2</span>${fp(r.tp2, r)}</div><div><span>TP3</span>${fp(r.tp3, r)}</div><div><span>防守</span>${fp(r.defense, r)}</div></div>${r.flags.length ? '<div style="margin-top:4px">' + r.flags.map(([c, t]) => `<span class="tag ${c}">${t}</span>`).join('') + '</div>' : ''}`;
  else if (tab === 'setup') r3 = `<div class="tps" style="grid-template-columns:repeat(3,1fr)"><div><span>突破位</span>${fp(r.setup.res, r)}</div><div><span>距離</span>${r.setup.gap.toFixed(1)}%</div><div><span>防守</span>${fp(r.setup.defense, r)}</div></div><div style="margin-top:4px">${r.setup.tags.map(([c, t]) => `<span class="tag ${c}">${t}</span>`).join('')}</div>`;

  else r3 = warnTags() + (r.supports.length && r.warnScore ? `<div class="mut" style="margin-top:3px">支撐 ${r.supports.map((v) => fp(v, r)).join(' → ')}</div>` : '') + (tab === 'watch' && (r.isBull || r.isBear) ? `<div style="margin-top:3px">${r.isBull ? '<span class="tag g">多頭續強</span>' : '<span class="tag r">空頭續弱</span>'}</div>` : '');
  return `<div class="coin ${tab === 'warn' && r.warnScore >= 5 ? 'hot' : ''}" data-sym="${esc(r.sym)}">
    <div class="r1"><button class="star ${w ? 'on' : ''}" data-star="${esc(r.sym)}" aria-label="自選">${w ? '★' : '☆'}</button><span class="sym">${esc(r.base)}</span>${r.kind ? `<span class="tag">${r.kind}</span>` : ''}${badge}

Object.assign(state, { newsCh: 'all', newsOnlyWatch: false, newsItems: [], newsCursor: null, newsLoading: false, newsOpen: new Set(),
  feed: [], feedEtag: null, newsUnread: 0, coinNews: new Map() });
try { state.newsLastNo = +localStorage.getItem('bnRadarNewsNo') || 0; } catch (e) { state.newsLastNo = 0; }
let tcConv = null;
function tc(x) { // 簡轉繁（台灣用字）；轉換庫沒載到就維持原文
  if (!x) return '';
  try { if (!tcConv && window.OpenCC) tcConv = OpenCC.Converter({ from: 'cn', to: 'tw' }); return tcConv ? tcConv(x) : x; } catch (e) { return x; }
}
function txt(v) {
  if (v == null) return '';
  if (typeof v === 'string') return v;
  if (typeof v === 'object') { for (const k of ['text', 'content', 'body', 'title']) if (typeof v[k] === 'string') return v[k]; return Object.values(v).find((x) => typeof x === 'string') || ''; }
  return String(v);
}
function newsParts(it) {
  const v = it.zh || it.en;
  let title, body;
  if (v && typeof v === 'object' && typeof v.title === 'string') { title = v.title; body = txt(v.text ?? v.content ?? v.body ?? ''); }
  else { const all = txt(v).trim(); const i = all.indexOf('\n'); title = i > 0 ? all.slice(0, i) : all; body = i > 0 ? all.slice(i + 1).trim() : ''; }
  return { title: tc(title), body: tc(body) };
}
const coinKey = (c) => String(c || '').toUpperCase().replace(/USDT$/, '').replace(/^(1000000|1000|1M)(?=[A-Z])/, '');
function newsTime(it) { const t = Date.parse(it.time); return isFinite(t) ? t : Date.now(); }
function agoStr(t) { const m = Math.max(0, Math.round((Date.now() - t) / 60e3)); return m < 1 ? '剛剛' : m < 60 ? `${m} 分前` : m < 1440 ? `${Math.floor(m / 60)} 小時前` : `${Math.floor(m / 1440)} 天前`; }
function aiHtml(ai) {
  if (!ai) return '';
  let h = '';
  const pts = (ai.summary && ai.summary.points) || [];
  if (pts.length) h += `<div class="ai"><b>AI 摘要</b><ul>${pts.map((p) => `<li>${esc(tc(txt(p.zh) || txt(p.en) || txt(p)))}</li>`).join('')}</ul></div>`;
  const ov = ai.overview;
  if (ov && ov.status === 'ready') {
    const o = ov.zh || ov.en; const ps = (o && o.paragraphs) || [];
    if (ps.length) h += `<div class="ai"><b>AI 總覽</b>${ps.map((p) => `<p>${esc(tc(txt(p.text) || txt(p)))}</p>`).join('')}</div>`;
  } else if (ov && ov.status === 'pending') h += '<div class="ai mut">AI 總覽產生中…</div>';
  return h ? h + '<div class="ai-note">AI 生成，僅供參考</div>' : '';
}
function newsHtml(it, compact) {
  const { title, body } = newsParts(it), t = newsTime(it);
  const coins = (it.coins || []).slice(0, 6).map((c) => `<span class="tag b" data-coin="${esc(coinKey(c))}">${esc(c)}</span>`).join('');
  const link = typeof it.url === 'string' && it.url.startsWith('https://') ? `<a class="nlink" href="${esc(it.url)}" target="_blank" rel="noopener">看原文 ›</a>` : '';
  const open = compact || state.newsOpen.has(String(it.no));
  return `<div class="news ${open ? 'open' : ''} ${Date.now() - t < 15 * 60e3 ? 'fresh' : ''}" data-no="${esc(it.no)}">
    <div class="nh"><span>${agoStr(t)}・${new Date(t).toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' })}</span><span class="ns">${esc(it.source || '')}</span></div>
    <div class="ntl">${esc(title)}</div>${coins ? `<div style="margin-top:4px">${coins}</div>` : ''}
    <div class="nbody">${body ? esc(body) : ''}${aiHtml(it.ai)}${link}</div></div>`;
}
async function newsGet(params) {
  const q = new URLSearchParams(params).toString();
  const r = await fetch(`${NEWS_API}/news?${q}`, { cache: 'no-store' });
  if (!r.ok) throw new Error('快訊 HTTP ' + r.status);
  return r.json();
}
function watchKeys() { return S.watchlist.map((x) => coinKey((state.info.get(x) || {}).base || x)); }

async function loadNews(more) {
  if (state.newsLoading) return;
  state.newsLoading = true; if (!more) { state.newsItems = []; state.newsCursor = null; } renderNews();
  try {
    if (state.newsOnlyWatch) {
      const keys = watchKeys().slice(0, 8);
      const lists = await Promise.all(keys.map((c) => newsGet({ coin: c, limit: 10 }).then((j) => j.items || []).catch(() => [])));
      const m = new Map(); lists.flat().forEach((it) => m.set(it.no, it));
      state.newsItems = [...m.values()].sort((a, b) => newsTime(b) - newsTime(a)); state.newsCursor = null;
    } else {
      const p = { channel: state.newsCh, limit: 30 }; if (more && state.newsCursor) p.before = state.newsCursor;
      const j = await newsGet(p);
      state.newsItems = more ? state.newsItems.concat(j.items || []) : (j.items || []); state.newsCursor = j.next_cursor || null;
    }
    state.newsErr = null;
  } catch (e) { state.newsErr = String(e.message || e); }
  state.newsLoading = false; state.newsUnread = 0; if (state.tab === 'news') render();
}
function renderNews() {
  $('nchips').innerHTML = NEWS_CH.map(([k, n]) => `<button class="chip ${!state.newsOnlyWatch && state.newsCh === k ? 'on' : ''}" data-nch="${k}">${n}</button>`).join('')
    + `<button class="chip ${state.newsOnlyWatch ? 'on' : ''}" data-nch="__watch">★ 只看自選</button>`;
  let h = state.newsItems.map((it) => newsHtml(it)).join('');
  if (!state.newsItems.length) h = `<div class="empty">${state.newsLoading ? '載入中…' : state.newsErr ? '讀不到快訊：' + esc(state.newsErr) : state.newsOnlyWatch && !S.watchlist.length ? '還沒有自選幣。' : '沒有快訊。'}</div>`;
  else if (state.newsCursor) h += `<button class="btn" data-nmore="1" style="width:100%;margin-top:10px">${state.newsLoading ? '載入中…' : '載入更多'}</button>`;
  $('list').innerHTML = `<div>${h}</div>`;
}
/* 背景輪詢（App 開著時每 30 秒）：更新卡片上的「快訊」標籤，並通知自選幣新聞 */
async function pollNews() {
  if (document.visibilityState !== 'visible') return;
  try {
    const r = await fetch(`${NEWS_API}/news?channel=all&limit=50`, { cache: 'no-store', headers: state.feedEtag ? { 'If-None-Match': state.feedEtag } : {} });
    if (r.status === 304) return;
    if (!r.ok) return;
    state.feedEtag = r.headers.get('ETag');
    const items = (await r.json()).items || [];
    state.feed = items;
    const cm = new Map();
    for (const it of items) for (const c of it.coins || []) { const k = coinKey(c); if (!cm.has(k)) cm.set(k, it); }
    state.coinNews = cm;
    const fresh = items.filter((it) => +it.no > state.newsLastNo && Date.now() - newsTime(it) < 20 * 60e3);
    const first = !state.newsLastNo;
    const maxNo = Math.max(state.newsLastNo, ...items.map((it) => +it.no || 0));
    if (maxNo > state.newsLastNo) { state.newsLastNo = maxNo; try { localStorage.setItem('bnRadarNewsNo', String(maxNo)); } catch (e) {} }
    if (!first && fresh.length) {
      const wk = new Set(watchKeys());
      fresh.slice().reverse().forEach((it) => {
        const hit = (it.coins || []).map(coinKey).filter((c) => wk.has(c));
        const isMain = (it.channels || []).includes('main');
        if ((S.notifyNews && hit.length) || (S.notifyNewsAll && isMain)) {
          const { title } = newsParts(it);
          notify('', `${hit.length ? hit.join('、') + ' 快訊' : '快訊'}`, title.slice(0, 140));
        }
      });
      if (state.tab !== 'news') state.newsUnread = (state.newsUnread || 0) + fresh.length;
      if (state.tab === 'news' && state.newsCh === 'all' && !state.newsOnlyWatch) {
        const have = new Set(state.newsItems.map((x) => x.no));
        state.newsItems = fresh.filter((x) => !have.has(x.no)).concat(state.newsItems);
      }
    }
    render();
  } catch (e) {}
}
function newsTag(r) {
  const it = state.coinNews.get(coinKey(r.base));
  if (!it || Date.now() - newsTime(it) > 6 * 3600e3) return '';
  return `<div style="margin-top:4px"><span class="tag b">快訊 ${agoStr(newsTime(it))}：${esc(newsParts(it).title.slice(0, 22))}…</span></div>`;
}
async function loadCoinNews(r) {
  const key = coinKey(r.base);
  try {
    const j = await newsGet({ coin: key, limit: 5 });
    const el = $('dnews'); if (!el || state.sheet !== 'detail') return;
    const items = j.items || [];
    el.innerHTML = items.length ? items.map((it) => newsHtml(it, true)).join('') : '<div class="mut">最近沒有這個幣的快訊。</div>';
  } catch (e) { const el = $('dnews'); if (el) el.innerHTML = '<div class="mut">讀不到快訊。</div>'; }
}
setInterval(pollNews, 30e3);
setTimeout(pollNews, 1500);

/* ---------- 上次結果快取：打開 App 先顯示上次掃描，不用等 ---------- */
function saveCache() {
  try {
    const now = Date.now();
    localStorage.setItem('bnRadarCache', JSON.stringify({
      t: state.lastScan, results: state.results, mkt: state.mkt,
      info: [...state.info], infoAt: state.infoAt,
      alerted: [...state.alerted].filter(([, v]) => now - v.t < 24 * 3600e3)
    }));
  } catch (e) {}
}
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem('bnRadarCache') || 'null');
    if (!c || !c.results || Date.now() - c.t > 24 * 3600e3) return false;
    state.info = new Map(c.info); state.infoAt = c.infoAt || 0;
    state.results = c.results; state.lastScan = c.t; state.mkt = c.mkt;
    state.alerted = new Map(c.alerted || []); state.firstDone = true; // 已通知過的不會因為重開 App 再通知一次
    classify();
    return true;
  } catch (e) { return false; }
}
pushGuard();
setInterval(tickStatus, 1000);
applyWake();
const hadCache = loadCache();
render();
if (hadCache && Date.now() - state.lastScan < S.interval * 60e3) {
  state.nextScan = state.lastScan + S.interval * 60e3;               // 上次掃描還新：照原本的時間表
  state.timer = setTimeout(scan, state.nextScan - Date.now());
  tickStatus();
} else scan();                                                        // 太舊才馬上重掃，畫面先顯示上次結果
</script>
</body>
</html>
